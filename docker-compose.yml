services:
  postgres:
    image: postgres:15-alpine
    container_name: portofolio-postgres
    restart: always
    environment:
      POSTGRES_USER: portofolio-riskidev
      POSTGRES_PASSWORD: postgres
      POSTGRES_DB: portofolio
    volumes:
      - postgres_data:/var/lib/postgresql/data
    ports:
      - 5432:5432

volumes:
  postgres_data:
